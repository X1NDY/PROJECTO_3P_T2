
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-5">

    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl border border-sky-500/30">

        <h1 class="text-3xl font-bold text-sky-400 text-center mb-6">
            Iniciar sesión
        </h1>

        <form id="loginForm" class="space-y-5">

            <div>
                <label for="email" class="block mb-2">Correo electrónico</label>
                <input id="email" name="email" type="email" autocomplete="username" required
                    class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700">
            </div>

            <div>
                <label for="password" class="block mb-2">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700">
            </div>

            <label class="flex items-center gap-2">
                <input id="remember" type="checkbox" checked>
                Recordarme
            </label>

            <button type="submit"
                class="w-full p-3 rounded-lg bg-sky-600 hover:bg-sky-500 font-bold">
                Iniciar sesión
            </button>

        </form>

        <p id="message" role="status" aria-live="polite" class="mt-4 text-center text-sm"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Datos de conexión de Supabase
        const SUPABASE_URL = "https://nakggxqpmnyiufhtwscn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_jdbt3wTQ1HiNcYjDcYzerQ_xLmvNN9P";

        // Crear conexión  
    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
);

const loginForm = document.getElementById("loginForm");
const botonLogin = loginForm.querySelector('button[type="submit"]');

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (botonLogin.disabled || !loginForm.reportValidity()) return;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    botonLogin.disabled = true;
    message.textContent = "Iniciando sesión...";
    message.style.color = "#38bdf8";

    try {
        const recordar = document.getElementById("remember").checked;
        const { data, error } = await supabaseClient.rpc("iniciar_sesion_usuario", {
            p_correo: email,
            p_contrasena: password,
            p_recordar: recordar
        });

        if (error || !data?.token) {
            message.textContent = error?.code === "PGRST202"
                ? "Falta configurar el acceso de usuarios en Supabase."
                : "Correo o contraseña incorrectos. La cuenta debe tener una contraseña y un correo único.";
            message.style.color = "#f87171";
            return;
        }

        localStorage.removeItem("sesion_usuarios");
        sessionStorage.removeItem("sesion_usuarios");
        const almacenamiento = recordar ? localStorage : sessionStorage;
        almacenamiento.setItem("sesion_usuarios", data.token);
        document.getElementById("password").value = "";

        message.textContent = "¡Inicio de sesión exitoso!";
        message.style.color = "#34d399";
        window.location.replace("index.html");
    } catch (error) {
        message.textContent = "No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.";
        message.style.color = "#f87171";
    } finally {
        botonLogin.disabled = false;
    }
});

    </script>
</body>

</html>
