<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Panel Neón</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="dashboard.css">
</head>

<!-- min-h-screen + flex + flex-col + md:flex-row: Estructura adaptable (columna en móvil, fila con barra lateral en PC) -->
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- Menú Lateral -->
    <aside class="sidebar w-full md:w-64 p-5 flex flex-col justify-between shrink-0">
        <div>
            <h1 class="text-base font-bold text-sky-400 mb-8">🚀 Traductores e Intérpretes II</h1>
            <nav class="space-y-2 text-sm" aria-label="Menú principal"><a href="index.html" class="menu-link">🏠 <span>Inicio</span></a>
<a href="inventario.html" class="menu-link" aria-current="page">📦 <span>Inventario</span></a>
<a href="personal.html" class="menu-link">👥 <span>Personal</span></a>
<a href="proveedores.html" class="menu-link">🏭 <span>Proveedores</span></a></nav>
        </div>
        <p class="mt-8 pt-4 border-t border-slate-800 text-xs text-slate-500">Sistema de Inventario</p>
    </aside>

    <!-- Contenedor Principal del Panel -->
    <div class="flex-1 min-w-0 p-4 md:p-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-sky-400">📦 Gestión de Inventario</h1>
            <p class="text-slate-400 mt-2">Administración y registro de productos del mercadito.</p>
        </header>
        <main class="space-y-8">
            
            <!-- Formulario de productos -->
            <section class="neon-card p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-6 text-sky-400">➕ Registrar Producto</h2>
                <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-slate-400">Nombre del Producto</label>
                        <input type="text" id="nombre" required class="w-full mt-1 p-2 rounded-lg neon-input">
                    </div>
                    <div>
                        <label for="cantidad" class="block text-sm font-medium text-slate-400">Cantidad</label>
                        <input type="number" id="cantidad" min="0" step="1" required class="w-full mt-1 p-2 rounded-lg neon-input">
                    </div>
                    <div>
                        <label for="precio" class="block text-sm font-medium text-slate-400">Precio (L)</label>
                        <input type="number" step="0.01" id="precio" min="0" required class="w-full mt-1 p-2 rounded-lg neon-input">
                    </div>
                    <div class="md:col-span-2 flex flex-wrap gap-3"><button type="submit" class="text-white px-6 py-3 rounded-lg font-bold neon-btn">
                        Guardar Producto
                    </button>
                <button id="cancelarEdicion" type="button" hidden class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-lg font-bold">Cancelar edición</button></div></form>
            </section>

            <!-- Listado de productos -->
            <!-- overflow-x-auto permite que si la pantalla es muy pequeña, la tabla se pueda deslizar horizontalmente sin romper el diseño -->
            <section class="neon-card p-6 rounded-2xl overflow-x-auto">
                <h2 class="text-lg font-semibold mb-4 text-sky-400">Inventario Actual</h2>
                <table class="tabla w-full min-w-[580px] text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm">
                            <th class="pb-2">Producto</th>
                            <th class="pb-2">Cantidad</th>
                            <th class="pb-2">Precio</th>
                            <th class="pb-2 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="4" class="py-4 text-center text-slate-500">Cargando inventario desde Supabase...</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <!-- Archivo JavaScript externo -->
    <script src="app.js"></script>
</body>
</html>
